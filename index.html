<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Новогодняя открытка 2027</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">

    <header>
      <h1>С Новым годом!</h1>
      <p class="year">2027</p>
      <p class="wish">Пусть сбываются мечты!</p>
    </header>

    <div class="moon"></div>
    <div class="ground"></div>

    <div class="snowman"><b></b><b></b><b></b><span class="arm"></span></div>

    <div class="tree">
      <img src="img/tree.png" alt="Ёлка">
      <i style="--x:.5em;   --y:10.1em"></i>
      <i style="--x:-.7em;  --y:8.5em"></i>
      <i style="--x:.8em;   --y:7.2em"></i>
      <i style="--x:-.9em;  --y:5.8em"></i>
      <i style="--x:1.6em;  --y:4.5em"></i>
      <i style="--x:-1.7em; --y:3.1em"></i>
      <i style="--x:2em;    --y:1.7em"></i>
      <i style="--x:-2.3em; --y:.4em"></i>
      <div class="star"></div>
    </div>

    <div class="gifts"><div class="gift"></div><div class="gift"></div></div>

  </div>
</body>
</html>
